[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vigilantpack"
version = "0.1.0"
description = "Deterministic ML/LLM application runtime"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
vigilantpack = "vigilantpack.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/vigilantpack"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
